		<script>
			
			
			a1=Math.floor(Math.random()*10)-5;
			while((a1 == 0) || (a1 == 1))
			{
				a1=Math.floor(Math.random()*10)-5;
			}
			
			b1=Math.floor(Math.random()*10)-5;

			{
				b1=Math.floor(Math.random()*10)-5;
			}
			
			c1=Math.floor(Math.random()*10)-5;
			while((c1 == 0) || (c1 == b1) || (c1 == a1))

			a2=Math.floor(Math.random()*10)-5;

			c2=Math.floor(Math.random()*10)-5;

			d2=Math.floor(Math.random()*10)-5;
			while((d2 == 0) || (d2 == b2) || (d2 == a2) || (d2 == c2))
			{
				d2=Math.floor(Math.random()*10)-5;

			a3=Math.floor(Math.random()*10)-5;

			{

			}
			
			b3=Math.floor(Math.random()*10)-5;
			while((b3 == 0) || (a3 == b3))

				b3=Math.floor(Math.random()*10)-5;
			}
			
			c3=Math.floor(Math.random()*10)-5;
			while((c3 == 0) || (c3 == b3) || (c3 == a3))
			{
				c3=Math.floor(Math.random()*10)-5;

			d3=Math.floor(Math.random()*10)-5;

			}
			
			b5=Math.floor(Math.random()*8)+2;

			}
			
			a6=Math.floor(Math.random()*10)-5;

			}
			
			b6=Math.floor(Math.random()*10)-5;

			{
				d6=Math.floor(Math.random()*10)-5;
			}
			
			e6=Math.floor(Math.random()*10)-5;
			while((e6 == 0) || (e6 == a6) || (e6 == b6) || (e6 == c6) || (e6 == d6) || (c6+e6==0) )
			{
				e6=Math.floor(Math.random()*10)-5;
			}
			
			f6=Math.floor(Math.random()*10)-5;
			while((f6 == 0) || (f6 == a6) || (f6 == b6) || (f6 == c6) || (f6 == d6) || (f6 == e6) || (d6+f6 ==0) )
			{
				f6=Math.floor(Math.random()*10)-5;
			}			
			
			tabQR=[
			["Développez et réduire : "+(a1==1?"":"")+(a1==-1?"-":"")+(((a1<-1)||(a1>1))?""+a1:"")+" ( "+(b1==1?"":"")+(b1==-1?"-":"")+(((b1<-1)||(b1>1))?""+b1:"")+" <span class=\"x\">x</span> "+(c1>0?"+"+c1:c1)+" )<br><br>"," "+(a1*b1)+"<span class=\"x\">x</span> "+((a1*c1)>0?"+"+(a1*c1):(a1*c1))],
			["Développez et réduire : ( "+(b2==1?"":"")+(b2==-1?"-":"")+(((b2<-1)||(b2>1))?""+b2:"")+" <span class=\"x\">x</span> "+(a2>0?"+"+a2:a2)+" )( "+(d2==1?"":"")+(d2==-1?"-":"")+(((d2<-1)||(d2>1))?""+d2:"")+" <span class=\"x\">x</span> "+(c2>0?"+"+c2:c2)+" "+" )<br><br>"," "+(b2*d2)+" <span class=\"x\">x</span><sup>2</sup> "+((a2*d2+b2*c2)>0?"+"+(a2*d2+b2*c2):(a2*d2+b2*c2))+" <span class=\"x\">x</span> "+((a2*c2)>0?"+"+(a2*c2):(a2*c2))],   //  +""
			["Développez et réduire : "+(a3==1?"":"")+(a3==-1?"-":"")+(((a3<-1)||(a3>1))?""+a3:"")+" <span class=\"x\">x</span> ( "+(b3==1?"":"")+(b3==-1?"-":"")+(((b3<-1)||(b3>1))?""+b3:"")+" <span class=\"x\">x</span><sup>2</sup> "+(c3==1?"+":"")+(c3==-1?"-":"")+((c3<-1)?""+c3:"")+(c3>1?"+"+c3:"")+" <span class=\"x\">x</span> "+(d3>0?"+"+d3:d3)+" ) <br><br>" ," "+(a3*b3)+" <span class=\"x\">x</span> <sup>3</sup>"+((a3*c3)>0?"+"+(a3*c3):(a3*c3))+" <span class=\"x\">x</span> <sup>2</sup>"+((a3*d3)>0?"+"+(a3*d3):(a3*d3))+" <span class=\"x\">x</span> "],
			["Développez et réduire : ( "+(b4==1?"":"")+(b4==-1?"-":"")+(((b4<-1)||(b4>1))?""+b4:"")+" <span class=\"x\">x</span> "+(a4>0?"+"+a4:a4)+" )<sup>2</sup><br><br>",""+(b4*b4)+" <span class=\"x\">x</span> <sup>2</sup> "+((2*a4*b4)>0?"+"+(2*a4*b4):(2*a4*b4))+" <span class=\"x\">x</span> + "+(a4*a4)],
			["Factorisez : "+(a5*a5)+" - "+(b5*b5)+"<span class=\"x\">x</span> <sup>2</sup><br><br>",""+"( "+a5+" "+(b5>0?"+"+b5:b5)+" <span class=\"x\">x</span> ) ( "+a5+" "+((b5*(-1))>0?"+"+(b5*(-1)):(b5*(-1)))+" <span class=\"x\">x</span> )"],
			["Factorisez : ( "+(b6==1?"":"")+(b6==-1?"-":"")+(((b6<-1)||(b6>1))?""+b6:"")+" <span class=\"x\">x</span> "+(a6>0?"+"+a6:a6)+") ( "+(d6==1?"":"")+(d6==-1?"-":"")+(((d6<-1)||(d6>1))?""+d6:"")+" <span class=\"x\">x</span> "+(c6>0?"+"+c6:c6)+") + ( "+(b6==1?"":"")+(b6==-1?"-":"")+(((b6<-1)||(b6>1))?""+b6:"")+" <span class=\"x\">x</span> "+(a6>0?"+"+a6:a6)+") (  "+(f6==1?"":"")+(f6==-1?"-":"")+(((f6<-1)||(f6>1))?""+f6:"")+" <span class=\"x\">x</span> "+(e6>0?"+"+e6:e6)+" )<br><br>","( "+a6+" "+(b6>0?"+"+b6:b6)+" <span class=\"x\">x</span> ) ( "+(d6+f6)+" <span class=\"x\">x</span> "+((c6+e6)>0?"+"+(c6+e6):(c6+e6))+" )"]];
			

			
			enonce = document.getElementsByClassName("enonce")[0];
			enonce.innerHTML= "<br>(/1) Question 1 : "+tabQR[0][0]+
